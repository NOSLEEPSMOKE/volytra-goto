plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
	maven {
		name = "meteor-maven"
		url = "https://maven.meteordev.org/releases"
	}
	maven {
		name = "meteor-maven-snapshots"
		url = "https://maven.meteordev.org/snapshots"
	}
	// VolytraFly has no maven: take its jar straight from the GitHub release
	// (.../releases/download/<version>/VolytraFly-<version>-<minecraft>.jar)
	ivy {
		name = "volytrafly-releases"
		url = "https://github.com/Volizray/VolytraFly-Addon/releases/download"
		patternLayout { artifact "[revision]/[module]-[revision]-[classifier].[ext]" }
		metadataSources { artifact() }
		content { includeGroup "com.volytrafly" }
	}
}

dependencies {
	// Minecraft 26.1+ is unobfuscated: no mappings, no remapping.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Compile only, not bundled: players install Meteor Client and VolytraFly themselves.
	compileOnly "meteordevelopment:meteor-client:${project.meteor_version}"
	compileOnly "com.volytrafly:VolytraFly:${project.volytrafly_version}:${project.minecraft_version}@jar"
}

processResources {
	def props = [version: project.mod_version, mc_version: project.minecraft_version]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") { rename { "LICENSE_volytragoto" } }
}
