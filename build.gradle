plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
	maven {
		name = "meteor-maven"
		url = "https://maven.meteordev.org/releases"
	}
	maven {
		name = "meteor-maven-snapshots"
		url = "https://maven.meteordev.org/snapshots"
	}
}

dependencies {
	// Minecraft 26.1+ is unobfuscated: no mappings, no remapping.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Compile only, not bundled. Meteor comes from its maven; VolytraFly has none, so its jar goes in libs/ - see
	// libs/README.md.
	compileOnly "meteordevelopment:meteor-client:${project.meteor_version}"
	compileOnly files("libs/VolytraFly-0.1.2-26.2.jar")
}

processResources {
	def props = [version: project.mod_version, mc_version: project.minecraft_version]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") { rename { "LICENSE_volytragoto" } }
}
